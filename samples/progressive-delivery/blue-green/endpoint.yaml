# The checkout API. Blue serves it until the switch.
apiVersion: openchoreo.dev/v1alpha1
kind: Endpoint
metadata:
  name: checkout
  namespace: default
spec:
  owner:
    projectName: default
  type:
    kind: ClusterEndpointType
    name: istio-http
  # External callers through the gateway, in-cluster callers through the mesh,
  # with the same split.
  visibility: [external, namespace]
  autoDeploy: true
  backendRefs:
    - name: checkout-blue
      kind: Component
      component:
        name: checkout-blue
        endpoint: http
