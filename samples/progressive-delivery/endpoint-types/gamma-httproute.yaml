# A Gateway API mesh (GAMMA) EndpointType for in-cluster, east-west callers.
# It renders one HTTPRoute whose parents are the backend components' own
# Services, so callers keep calling the address they already use, and any mesh
# that implements GAMMA applies the Endpoint's matches and weighted split from
# ${rules}. It declares only Match: request mirroring and regular expression
# headers are optional in GAMMA, so an Endpoint that needs them is refused
# instead of rendering a route the mesh may ignore.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: gamma-httproute
spec:
  capabilities: [Match]
  validations:
    - rule: ${visibility == ["namespace"]}
      message: gamma-httproute serves in-cluster callers only; set spec.visibility to [namespace]
    - rule: ${backends.all(b, b.protocol in ["HTTP", "GraphQL", "Websocket"])}
      message: gamma-httproute only routes HTTP, GraphQL and Websocket endpoints
  resources:
    - id: mesh-route
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${oc_generate_name(metadata.endpointName, "mesh")}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          parentRefs: |
            ${backends.map(b, {"group": "", "kind": "Service", "name": b.serviceName, "port": b.port})}
          rules: |
            ${rules.map(r, {
                "matches": size(r.matches) > 0
                  ? r.matches.map(m, {
                      "path": has(m.path) ? {"type": m.path.type, "value": m.path.value} : oc_omit(),
                      "headers": size(m.conditions) > 0
                        ? m.conditions.map(h, {"type": h.type, "name": h.name, "value": h.value})
                        : oc_omit()
                    })
                  : oc_omit(),
                "backendRefs": r.backends.filter(b, b.weight > 0)
                  .map(b, {"name": b.serviceName, "port": b.port, "weight": b.weight})
              })}
