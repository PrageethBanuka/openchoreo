# Shared traffic parameters for EndpointTypes.
#
# Every bundled EndpointType copies this schema into spec.parameters, trimmed
# to what its gateway or mesh can render, so the type's schema doubles as its
# list of supported traffic features: an Endpoint that asks for a feature its
# type left out is refused at admission. Backends are referred to by their
# spec.backendRefs name. Keep the copies in sync with this file; a unit test
# (internal/pipeline/endpoint/sample_types_test.go) checks them.
#
# rules   - ordered, first match wins, evaluated before the default split of
#           spec.backendRefs by weight.
# mirrors - copy a share of the default split's requests to a backend and
#           discard its responses; the target is usually a weight-0 backend.
openAPIV3Schema:
  type: object
  properties:
    rules:
      type: array
      default: []
      maxItems: 15
      items:
        type: object
        required: [name, matches, backendRefs]
        properties:
          name:
            type: string
            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
          matches:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                headers:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
                      type: { type: string, enum: [Exact, RegularExpression], default: Exact }
                cookies:
                  type: array
                  maxItems: 1
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
                      value: { type: string, pattern: "^[A-Za-z0-9_.-]+$" }
                queryParams:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
                method:
                  type: string
                  enum: [GET, HEAD, POST, PUT, DELETE, OPTIONS, PATCH]
          backendRefs:
            type: array
            minItems: 1
            maxItems: 16
            items:
              type: object
              required: [name]
              properties:
                name: { type: string }
                weight: { type: integer, minimum: 0, default: 1 }
    mirrors:
      type: array
      default: []
      items:
        type: object
        required: [backendRef, percent]
        properties:
          backendRef: { type: string }
          percent: { type: integer, minimum: 0, maximum: 100 }
