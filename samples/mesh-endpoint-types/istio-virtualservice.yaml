apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: istio-virtualservice
  annotations:
    openchoreo.dev/description: >-
      Serves an Endpoint to in-cluster (east-west) callers through an Istio
      sidecar mesh. Emits a stable Service named after the Endpoint and one
      Service per backend, and a VirtualService on the stable Service's host
      that applies the backends' matches, split and mirrors, including the
      canary, blue/green and A/B rollouts the portal runs. Install it only on
      data planes running Istio with sidecars on the callers; without Istio
      the VirtualService fails to apply and the binding reports it. In
      ambient mode, use mesh-gamma instead: VirtualService on waypoints is
      Alpha.
spec:
  allowedBackendKinds:
    - Component
  validations:
    - rule: ${visibility == ["namespace"]}
      message: >-
        istio-virtualservice serves in-cluster callers only; set spec.visibility to
        [namespace], or use the http type to serve a gateway as well
    - rule: ${backends.all(b, b.protocol in ["HTTP", "GraphQL", "Websocket"])}
      message: istio-virtualservice only routes HTTP, GraphQL and Websocket endpoints
  resources:
    # The stable Service: the Endpoint's in-cluster address, selecting the
    # primary backend (the highest weight in the default rule). The mesh
    # routes its traffic.
    - id: stable-service
      targetPlane: dataplane
      forEach: >-
        ${rules[size(rules) - 1].backends.filter(b,
          rules[size(rules) - 1].backends.all(o, o.weight <= b.weight)).slice(0, 1)}
      var: primary
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${metadata.endpointName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          type: ClusterIP
          selector: ${primary.podSelector}
          ports:
            - name: http
              port: 80
              targetPort: ${primary.targetPort}
              appProtocol: http
    # One Service per backend, which the mesh resource weights.
    - id: backend-service
      targetPlane: dataplane
      forEach: ${backends}
      var: backend
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${backend.serviceName}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-backend": backend.name})}'
        spec:
          type: ClusterIP
          selector: ${backend.podSelector}
          ports:
            - name: http
              port: ${backend.port}
              targetPort: ${backend.targetPort}
              appProtocol: http
    - id: virtual-service
      targetPlane: dataplane
      template:
        apiVersion: networking.istio.io/v1
        kind: VirtualService
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          hosts:
            - ${metadata.endpointName + "." + metadata.namespace + ".svc.cluster.local"}
          # One route per rule: each matched backend in order, then the default split (first match wins). The
          # controller hands over each match's conditions ready to render:
          # header names lowercased, as Istio requires, the cookie as an
          # escaped regex on the cookie header, and each header at most once,
          # so they map onto Istio's headers map without clashes. A path is
          # matched with its regex, because Istio's prefix is a plain string
          # prefix and /next would also match /nextpage.
          http: |
            ${rules.map(r, {
                "name": r.name,
                "match": size(r.matches) > 0
                  ? r.matches.map(m, {
                      "uri": has(m.path) ? {"regex": m.path.regex} : oc_omit(),
                      "headers": size(m.conditions) > 0
                        ? m.conditions.transformMapEntry(i, h,
                            {h.name: h.type == "Exact" ? {"exact": h.value} : {"regex": h.value}})
                        : oc_omit()
                    })
                  : oc_omit(),
                "route": r.backends.filter(b, b.weight > 0).map(b, {
                  "destination": {"host": b.serviceName + "." + b.namespace + ".svc.cluster.local",
                                  "port": {"number": b.port}},
                  "weight": b.weight}),
                "mirrors": size(r.mirrors) > 0
                  ? r.mirrors.map(mi, {
                      "destination": {"host": mi.backend.serviceName + "." + mi.backend.namespace + ".svc.cluster.local",
                                      "port": {"number": mi.backend.port}},
                      "percentage": {"value": double(mi.percent)}})
                  : oc_omit()
              })}
