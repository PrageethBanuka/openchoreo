apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: cilium-cec
  annotations:
    openchoreo.dev/description: >-
      Serves an Endpoint to in-cluster (east-west) callers through Cilium's
      per-node Envoy. Emits a stable Service named after the Endpoint and one
      Service per backend, and a CiliumEnvoyConfig that redirects the stable
      Service and applies the backends' matches, split and mirrors. Needs Cilium
      with kubeProxyReplacement=true and envoyConfig.enabled=true, and a
      DataPlane annotated openchoreo.dev/service-mesh=cilium.
spec:
  allowedBackendKinds:
    - Component
  validations:
    - rule: >-
        ${has(dataplane.annotations) && dataplane.annotations[?"openchoreo.dev/service-mesh"].orValue("") == "cilium"}
      message: >-
        cilium-cec needs Cilium's Envoy on the data plane: annotate the
        DataPlane with openchoreo.dev/service-mesh=cilium
    - rule: ${visibility == ["namespace"]}
      message: >-
        cilium-cec serves in-cluster callers only; set spec.visibility to
        [namespace], or use the http type to serve a gateway as well
    - rule: ${backends.all(b, b.protocol in ["HTTP", "GraphQL", "Websocket"])}
      message: cilium-cec only routes HTTP, GraphQL and Websocket endpoints
  resources:
    # The stable Service: the Endpoint's in-cluster address, selecting the
    # primary backend (the highest weight in the default rule). The mesh
    # routes its traffic.
    - id: stable-service
      targetPlane: dataplane
      forEach: >-
        ${rules[size(rules) - 1].backends.filter(b,
          rules[size(rules) - 1].backends.all(o, o.weight <= b.weight)).slice(0, 1)}
      var: primary
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${metadata.endpointName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          type: ClusterIP
          selector: ${primary.podSelector}
          ports:
            - name: http
              port: 80
              targetPort: ${primary.targetPort}
              appProtocol: http
    # One Service per backend, which the mesh resource weights.
    - id: backend-service
      targetPlane: dataplane
      forEach: ${backends}
      var: backend
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${backend.serviceName}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-backend": backend.name})}'
        spec:
          type: ClusterIP
          selector: ${backend.podSelector}
          ports:
            - name: http
              port: ${backend.port}
              targetPort: ${backend.targetPort}
              appProtocol: http
    - id: envoy-config
      targetPlane: dataplane
      template:
        apiVersion: cilium.io/v2
        kind: CiliumEnvoyConfig
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
          annotations:
            # Cilium asks hand-written east-west configs to set this, so pooled
            # upstream connections don't collide on the 5-tuple.
            cec.cilium.io/use-original-source-address: "false"
        spec:
          # Traffic to the stable Service goes to Envoy; the backends'
          # endpoints are synced to Envoy without redirecting them.
          services:
            - name: ${metadata.endpointName}
              namespace: ${metadata.namespace}
          backendServices: |
            ${backends.map(b, {"name": b.serviceName, "namespace": b.namespace})}
          # A listener, its routes (one per rule match, in order; the default rule
          # last), and one EDS cluster per backend named <namespace>/<service>,
          # the name Cilium syncs endpoints under.
          resources: |
            ${[{
                "@type": "type.googleapis.com/envoy.config.listener.v3.Listener",
                "name": metadata.name + "-listener",
                "filter_chains": [{"filters": [{
                  "name": "envoy.filters.network.http_connection_manager",
                  "typed_config": {
                    "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager",
                    "stat_prefix": metadata.name,
                    "rds": {"route_config_name": metadata.name + "-route"},
                    "http_filters": [{
                      "name": "envoy.filters.http.router",
                      "typed_config": {"@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"}}]}}]}]
              }, {
                "@type": "type.googleapis.com/envoy.config.route.v3.RouteConfiguration",
                "name": metadata.name + "-route",
                "virtual_hosts": [{
                  "name": metadata.name,
                  "domains": ["*"],
                  "routes": rules.map(r, (size(r.matches) > 0 ? r.matches : [{"conditions": []}]).map(m, {
                      "match": has(m.path)
                        ? {
                            "safe_regex": {"regex": m.path.regex},
                            "headers": size(m.conditions) > 0
                              ? m.conditions.map(h, {"name": h.name, "string_match":
                                  h.type == "Exact" ? {"exact": h.value} : {"safe_regex": {"regex": h.value}}})
                              : oc_omit()
                          }
                        : {
                            "prefix": "/",
                            "headers": size(m.conditions) > 0
                              ? m.conditions.map(h, {"name": h.name, "string_match":
                                  h.type == "Exact" ? {"exact": h.value} : {"safe_regex": {"regex": h.value}}})
                              : oc_omit()
                          },
                      "route": {
                        "weighted_clusters": {"clusters": r.backends.filter(b, b.weight > 0)
                          .map(b, {"name": b.namespace + "/" + b.serviceName, "weight": b.weight})},
                        "request_mirror_policies": size(r.mirrors) > 0
                          ? r.mirrors.map(mi, {
                              "cluster": mi.backend.namespace + "/" + mi.backend.serviceName,
                              "runtime_fraction": {"default_value": {"numerator": mi.percent, "denominator": "HUNDRED"}}})
                          : oc_omit()
                      }
                    })).flatten()
                }]
              }] + backends.map(b, {
                "@type": "type.googleapis.com/envoy.config.cluster.v3.Cluster",
                "name": b.namespace + "/" + b.serviceName,
                "type": "EDS",
                "connect_timeout": "5s"
              })}
