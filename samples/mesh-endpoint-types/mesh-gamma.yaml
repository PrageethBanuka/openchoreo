apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: mesh-gamma
  annotations:
    openchoreo.dev/description: >-
      Serves an Endpoint to in-cluster (east-west) callers through the service
      mesh. Emits a stable Service named after the Endpoint and one Service per
      backend, and a Gateway API mesh (GAMMA) HTTPRoute on the stable Service
      that applies the Endpoint's rules and split. Works on Istio (ambient with
      a waypoint, or sidecars), Cilium 1.16+ and Linkerd 2.14+; the DataPlane
      names its mesh with the openchoreo.dev/service-mesh annotation. Linkerd
      does not support mirroring.
spec:
  allowedBackendKinds:
    - Component
  validations:
    - rule: >-
        ${has(dataplane.annotations) && dataplane.annotations[?"openchoreo.dev/service-mesh"].orValue("") in ["istio", "cilium", "linkerd"]}
      message: >-
        mesh-gamma needs a service mesh on the data plane: annotate the DataPlane
        with openchoreo.dev/service-mesh set to istio, cilium or linkerd
    - rule: ${visibility == ["namespace"]}
      message: >-
        mesh-gamma serves in-cluster callers only; set spec.visibility to
        [namespace], or use the http type to serve a gateway as well
    - rule: ${backends.all(b, b.protocol in ["HTTP", "GraphQL", "Websocket"])}
      message: mesh-gamma only routes HTTP, GraphQL and Websocket endpoints
    - rule: >-
        ${rules.all(r, size(r.mirrors) == 0) ||
          dataplane.annotations["openchoreo.dev/service-mesh"] != "linkerd"}
      message: Linkerd does not support request mirroring; remove the mirrors on this data plane
  resources:
    # The stable Service: the Endpoint's in-cluster address, selecting the
    # primary backend (the highest weight in the catch-all rule). The mesh
    # routes its traffic.
    - id: stable-service
      targetPlane: dataplane
      forEach: >-
        ${rules[size(rules) - 1].backends.filter(b,
          rules[size(rules) - 1].backends.all(o, o.weight <= b.weight)).slice(0, 1)}
      var: primary
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${metadata.endpointName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          type: ClusterIP
          selector: ${primary.podSelector}
          ports:
            - name: http
              port: 80
              targetPort: ${primary.targetPort}
              appProtocol: http
    # One Service per backend, which the mesh resource weights.
    - id: backend-service
      targetPlane: dataplane
      forEach: ${backends}
      var: backend
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${backend.serviceName}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-backend": backend.name})}'
        spec:
          type: ClusterIP
          selector: ${backend.podSelector}
          ports:
            - name: http
              port: ${backend.port}
              targetPort: ${backend.targetPort}
              appProtocol: http
    - id: mesh-route
      targetPlane: dataplane
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          parentRefs:
            - group: ""
              kind: Service
              name: ${metadata.endpointName}
              port: 80
          # One rule per Endpoint rule, in order; the last is the catch-all.
          # Cookies match as a regex on the Cookie header.
          rules: |
            ${rules.map(r, {
                "matches": size(r.matches) > 0
                  ? r.matches.map(m, {
                      "headers": size(m.headers) + size(m.cookies) > 0
                        ? m.headers.map(h, {"type": h.type, "name": h.name, "value": h.value}) +
                          m.cookies.map(c, {"type": "RegularExpression", "name": "cookie",
                            "value": "(.*;\\s*)?" + c.name + "=" + c.value + "(;.*)?"})
                        : oc_omit(),
                      "queryParams": size(m.queryParams) > 0
                        ? m.queryParams.map(q, {"type": "Exact", "name": q.name, "value": q.value})
                        : oc_omit()
                    })
                  : oc_omit(),
                "filters": size(r.mirrors) > 0
                  ? r.mirrors.map(mi, {"type": "RequestMirror", "requestMirror": {
                      "backendRef": {"name": mi.backend.serviceName, "port": mi.backend.port}, "percent": mi.percent}})
                  : oc_omit(),
                "backendRefs": r.backends.filter(b, b.weight > 0)
                  .map(b, {"name": b.serviceName, "port": b.port, "weight": b.weight})
              })}
