apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: http-weighted
  annotations:
    openchoreo.dev/description: >-
      Serves the Endpoint's own address on the external gateway, and splits its
      traffic across the Endpoint's backends by weight: component endpoints and,
      when allowed, external services. With a take-over it also serves that
      component's existing URL, so its clients move without a gap. Renders
      kgateway Backend objects for external backends; at most one external
      host per Endpoint.
spec:
  allowedHostnames:
    - "*.openchoreoapis.localhost"
  allowedBackendKinds:
    - Component
    - External
  validations:
    - rule: ${backends.all(b, b.protocol in ["HTTP", "GraphQL", "Websocket"])}
      message: http-weighted only routes HTTP, GraphQL and Websocket endpoints
    - rule: ${backends.filter(b, b.kind == "External").map(b, b.external.host).distinct().size() <= 1}
      message: http-weighted rewrites the Host header for the whole route, so all external backends must share one host
    - rule: ${takeOver == null || has(takeOver.external)}
      message: >-
        the taken-over component endpoint must be exposed on the external
        gateway, since http-weighted serves the external gateway
  resources:
    - id: route
      targetPlane: dataplane
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-visibility": "external"})}'
        spec:
          parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
          hostnames:
            - ${address.host}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: ${address.path}
              # Rewrites apply to the whole rule: kgateway doesn't support
              # per-backend URLRewrite, and Envoy refuses Host header
              # modifiers. So the served prefix is rewritten to the component
              # backends' base path (canary versions share it), and with an
              # external backend the Host is rewritten to its hostname, which
              # in-cluster component Services ignore. One external host per
              # Endpoint.
              filters: &rewrite |
                ${[{"type": "URLRewrite", "urlRewrite": backends.exists(b, b.kind == "External")
                  ? {"hostname": backends.filter(b, b.kind == "External")[0].external.host,
                     "path": {"type": "ReplacePrefixMatch", "replacePrefixMatch": backends.exists(b, b.kind == "Component") ? backends.filter(b, b.kind == "Component")[0].basePath : "/"}}
                  : {"path": {"type": "ReplacePrefixMatch", "replacePrefixMatch": backends.exists(b, b.kind == "Component") ? backends.filter(b, b.kind == "Component")[0].basePath : "/"}}}]}
              backendRefs: &backendRefs |
                ${backends.map(b, b.kind == "External"
                  ? {"group": "gateway.kgateway.dev", "kind": "Backend", "name": b.serviceName, "weight": b.weight}
                  : {"name": b.serviceName, "port": b.port, "weight": b.weight})}
    - id: takeover-route
      targetPlane: dataplane
      # Only when the taken-over URL differs from the Endpoint's own address;
      # a workload-declared Endpoint's address is that URL already.
      includeWhen: ${takeOver != null && has(takeOver.external) && (takeOver.external.host != address.host || takeOver.external.path != address.path)}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${metadata.name}-takeover
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-visibility": "external", "openchoreo.dev/endpoint-route": "takeover"})}'
        spec:
          parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
          hostnames:
            - ${takeOver.external.host}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: ${takeOver.external.path}
              filters: *rewrite
              backendRefs: *backendRefs
    - id: external-backend
      targetPlane: dataplane
      forEach: ${backends.filter(b, b.kind == "External")}
      var: ext
      template:
        apiVersion: gateway.kgateway.dev/v1alpha1
        kind: Backend
        metadata:
          name: ${ext.serviceName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          type: Static
          static:
            hosts:
              - host: ${ext.external.host}
                port: ${ext.external.port}
    - id: external-backend-tls
      targetPlane: dataplane
      forEach: ${backends.filter(b, b.kind == "External" && b.external.scheme == "https")}
      var: ext
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: BackendTLSPolicy
        metadata:
          name: ${ext.serviceName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          targetRefs:
            - group: gateway.kgateway.dev
              kind: Backend
              name: ${ext.serviceName}
          validation:
            hostname: ${ext.external.host}
            wellKnownCACertificates: System
