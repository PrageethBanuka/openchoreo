---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: endpointreleasebindings.openchoreo.dev
spec:
  group: openchoreo.dev
  names:
    kind: EndpointReleaseBinding
    listKind: EndpointReleaseBindingList
    plural: endpointreleasebindings
    shortNames:
    - eprb
    - eprbs
    singular: endpointreleasebinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner.projectName
      name: Project
      type: string
    - jsonPath: .spec.owner.endpointName
      name: Endpoint
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.endpointRelease
      name: Release
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EndpointReleaseBinding is the Schema for the endpointreleasebindings API.
          Pins an EndpointRelease to an Environment, resolves its backends to the
          environment's component services, and renders the EndpointType's routing
          resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EndpointReleaseBindingSpec defines the desired state of EndpointReleaseBinding.
              Pins an EndpointRelease to an Environment and carries per-env overrides.
            properties:
              backendOverrides:
                description: |-
                  BackendOverrides sets environment-specific values for the release's
                  backends, matched by name. Today it sets an external backend's URL, so
                  staging can call a staging service while the release stays the same.
                items:
                  description: EndpointBackendOverride sets an environment-specific
                    value for one backend.
                  properties:
                    external:
                      description: External overrides an external backend's URL in
                        this environment.
                      properties:
                        url:
                          description: URL is the service's base URL, for example
                            https://legacy.example.com.
                          maxLength: 2048
                          pattern: ^https?://[a-zA-Z0-9]([-a-zA-Z0-9.]*[a-zA-Z0-9])?(:[0-9]{1,5})?(/.*)?$
                          type: string
                      required:
                      - url
                      type: object
                    name:
                      description: Name is the backend's name in the release.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              endpointRelease:
                description: |-
                  EndpointRelease is the name of the EndpointRelease pinned by this binding.
                  Unset before the first EndpointRelease is cut; the controller leaves the
                  binding pending until set.
                type: string
              endpointTypeEnvironmentConfigs:
                description: |-
                  EndpointTypeEnvironmentConfigs provides per-environment values for the schema
                  declared on the referenced EndpointType (or ClusterEndpointType). Validated
                  against EndpointType.spec.environmentConfigs by the binding controller;
                  failures surface via status.conditions.
                x-kubernetes-preserve-unknown-fields: true
              environment:
                description: Environment is the name of the Environment this binding
                  targets.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.environment is immutable
                  rule: self == oldSelf
              hostname:
                description: |-
                  Hostname overrides the Endpoint's address.hostname in this environment,
                  for example payments.staging.example.com. It must match the
                  EndpointType's allowedHostnames.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                type: string
              owner:
                description: Owner identifies the endpoint and project this EndpointReleaseBinding
                  belongs to.
                properties:
                  endpointName:
                    description: EndpointName is the name of the Endpoint.
                    minLength: 1
                    type: string
                  projectName:
                    description: ProjectName is the name of the project that owns
                      this endpoint.
                    minLength: 1
                    type: string
                required:
                - endpointName
                - projectName
                type: object
                x-kubernetes-validations:
                - message: spec.owner is immutable
                  rule: self == oldSelf
            required:
            - environment
            - owner
            type: object
          status:
            description: EndpointReleaseBindingStatus defines the observed state of
              EndpointReleaseBinding.
            properties:
              addresses:
                description: |-
                  Addresses are the host and path pairs this binding serves in its
                  environment, recorded once resolved. Bindings compare them to keep one
                  route per address.
                items:
                  description: EndpointResolvedAddress is an address a binding serves
                    in its environment.
                  properties:
                    host:
                      description: Host is the hostname clients call.
                      type: string
                    kind:
                      description: |-
                        Kind is Address for the Endpoint's own address and TakeOver for a
                        taken-over component URL.
                      enum:
                      - Address
                      - TakeOver
                      type: string
                    path:
                      description: Path is the path prefix clients call.
                      type: string
                  required:
                  - host
                  - kind
                  - path
                  type: object
                type: array
              backends:
                description: |-
                  Backends holds the resolution result of each backendRef for this binding's
                  environment. A backend whose component is not deployed in the environment is
                  reported with resolved=false rather than silently receiving its share of traffic.
                items:
                  description: |-
                    ResolvedEndpointBackend is the resolution of a single EndpointBackendRef in an
                    environment, populated by the binding controller.
                  properties:
                    componentName:
                      description: ComponentName is the name of the backend Component,
                        for a component backend.
                      type: string
                    endpoint:
                      description: Endpoint is the name of the workload endpoint,
                        for a component backend.
                      type: string
                    externalURL:
                      description: ExternalURL is the URL used in this environment,
                        for an external backend.
                      type: string
                    name:
                      description: Name is the backend's name in the release.
                      minLength: 1
                      type: string
                    reason:
                      description: Reason explains why the backend could not be resolved.
                      type: string
                    resolved:
                      description: Resolved indicates whether the backend was found
                        deployed in this environment.
                      type: boolean
                    serviceURL:
                      description: ServiceURL is the in-cluster service URL of the
                        backend in this environment.
                      properties:
                        host:
                          description: Host is the hostname or IP address.
                          minLength: 1
                          type: string
                        path:
                          description: Path is the URL path.
                          type: string
                        port:
                          description: Port is the port number.
                          format: int32
                          type: integer
                        scheme:
                          description: Scheme is the URL scheme (e.g., http, https,
                            tcp, udp, ws, wss, grpc, grpcs, tls).
                          type: string
                      required:
                      - host
                      type: object
                    weight:
                      description: Weight is the effective weight applied to this
                        backend.
                      format: int32
                      type: integer
                  required:
                  - name
                  - resolved
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions represent the latest available observations of the binding's state.
                  Includes BackendsResolved and Ready (aggregate). observedGeneration is set
                  per-condition (project convention).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalURLs:
                description: ExternalURLs holds the resolved external gateway URLs.
                properties:
                  http:
                    description: |-
                      HTTP is the URL served via the cleartext http listener. Populated when the
                      endpoint is exposed by an HTTPRoute or GRPCRoute and the gateway has an
                      http listener configured.
                    properties:
                      host:
                        description: Host is the hostname or IP address.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the URL path.
                        type: string
                      port:
                        description: Port is the port number.
                        format: int32
                        type: integer
                      scheme:
                        description: Scheme is the URL scheme (e.g., http, https,
                          tcp, udp, ws, wss, grpc, grpcs, tls).
                        type: string
                    required:
                    - host
                    type: object
                  https:
                    description: |-
                      HTTPS is the URL served via the https listener (TLS terminated at the
                      gateway). Populated when the endpoint is exposed by an HTTPRoute or
                      GRPCRoute and the gateway has an https listener configured.
                    properties:
                      host:
                        description: Host is the hostname or IP address.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the URL path.
                        type: string
                      port:
                        description: Port is the port number.
                        format: int32
                        type: integer
                      scheme:
                        description: Scheme is the URL scheme (e.g., http, https,
                          tcp, udp, ws, wss, grpc, grpcs, tls).
                        type: string
                    required:
                    - host
                    type: object
                  tls:
                    description: |-
                      TLS is the URL served via the tls listener (TLS passthrough; the
                      application terminates TLS). Populated when a TLSRoute exposes the
                      endpoint and the gateway has a tls listener configured.
                    properties:
                      host:
                        description: Host is the hostname or IP address.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the URL path.
                        type: string
                      port:
                        description: Port is the port number.
                        format: int32
                        type: integer
                      scheme:
                        description: Scheme is the URL scheme (e.g., http, https,
                          tcp, udp, ws, wss, grpc, grpcs, tls).
                        type: string
                    required:
                    - host
                    type: object
                type: object
              internalURLs:
                description: InternalURLs holds the resolved internal gateway URLs.
                properties:
                  http:
                    description: |-
                      HTTP is the URL served via the cleartext http listener. Populated when the
                      endpoint is exposed by an HTTPRoute or GRPCRoute and the gateway has an
                      http listener configured.
                    properties:
                      host:
                        description: Host is the hostname or IP address.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the URL path.
                        type: string
                      port:
                        description: Port is the port number.
                        format: int32
                        type: integer
                      scheme:
                        description: Scheme is the URL scheme (e.g., http, https,
                          tcp, udp, ws, wss, grpc, grpcs, tls).
                        type: string
                    required:
                    - host
                    type: object
                  https:
                    description: |-
                      HTTPS is the URL served via the https listener (TLS terminated at the
                      gateway). Populated when the endpoint is exposed by an HTTPRoute or
                      GRPCRoute and the gateway has an https listener configured.
                    properties:
                      host:
                        description: Host is the hostname or IP address.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the URL path.
                        type: string
                      port:
                        description: Port is the port number.
                        format: int32
                        type: integer
                      scheme:
                        description: Scheme is the URL scheme (e.g., http, https,
                          tcp, udp, ws, wss, grpc, grpcs, tls).
                        type: string
                    required:
                    - host
                    type: object
                  tls:
                    description: |-
                      TLS is the URL served via the tls listener (TLS passthrough; the
                      application terminates TLS). Populated when a TLSRoute exposes the
                      endpoint and the gateway has a tls listener configured.
                    properties:
                      host:
                        description: Host is the hostname or IP address.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the URL path.
                        type: string
                      port:
                        description: Port is the port number.
                        format: int32
                        type: integer
                      scheme:
                        description: Scheme is the URL scheme (e.g., http, https,
                          tcp, udp, ws, wss, grpc, grpcs, tls).
                        type: string
                    required:
                    - host
                    type: object
                type: object
              invokeURL:
                description: |-
                  InvokeURL is the primary resolved URL for this endpoint in the environment,
                  derived from the rendered routing resources.
                type: string
              serving:
                description: |-
                  Serving records the routing last confirmed accepted on the data plane. It
                  is this binding's claim on its backends' workload endpoints: component
                  ReleaseBindings stop rendering their own gateway routes for the claimed
                  (component, endpoint, visibility) slots. It changes only when a newly
                  rendered route is accepted, so it holds steady while a later render is
                  still progressing or its backends are unresolved.
                properties:
                  endpointRelease:
                    description: EndpointRelease is the release whose rendered routes
                      were accepted.
                    minLength: 1
                    type: string
                  releasing:
                    description: |-
                      Releasing is set while the binding is being deleted. Component
                      ReleaseBindings resume rendering their own routes; this binding keeps its
                      route until they are live again, so traffic is never left without a route.
                    type: boolean
                  since:
                    description: Since is when this claim was first established.
                    format: date-time
                    type: string
                  urls:
                    description: |-
                      URLs are the component workload endpoints whose URLs the accepted routes
                      serve: the Endpoint's spec.url. Those components stop rendering their own
                      routes for them; other backends keep their own URLs.
                    items:
                      description: EndpointBackendSlot identifies a component workload
                        endpoint.
                      properties:
                        componentName:
                          description: ComponentName is the name of the backend Component.
                          minLength: 1
                          type: string
                        endpoint:
                          description: Endpoint is the name of the workload endpoint
                            on the Component.
                          minLength: 1
                          type: string
                      required:
                      - componentName
                      - endpoint
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - componentName
                    - endpoint
                    x-kubernetes-list-type: map
                  visibilities:
                    description: |-
                      Visibilities are the gateway visibilities the accepted routes serve, from
                      their openchoreo.dev/endpoint-visibility label (external by default).
                      Component routes of other visibilities are left in place.
                    items:
                      description: |-
                        EndpointVisibility defines the visibility scope for an endpoint.
                        It determines which components can access the endpoint and how that access is enforced at runtime.
                      enum:
                      - project
                      - namespace
                      - internal
                      - external
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                required:
                - endpointRelease
                - since
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
