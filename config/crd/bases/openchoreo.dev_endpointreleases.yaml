        description: |-
          EndpointRelease is the Schema for the endpointreleases API. An immutable
          snapshot of an Endpoint and its referenced (Cluster)EndpointType at a point in
          time. Created by the Endpoint controller when the hash of Endpoint.spec +
          (Cluster)EndpointType.spec changes.
        properties:
