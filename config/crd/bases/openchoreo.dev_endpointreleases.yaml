              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EndpointReleaseSpec defines the desired state of EndpointRelease.
              An EndpointRelease is an immutable snapshot of Endpoint.spec and the referenced
              EndpointType (or ClusterEndpointType) spec at the time it was cut. Created
              exclusively by the Endpoint controller.
            properties:
              backendRefs:
                description: |-
