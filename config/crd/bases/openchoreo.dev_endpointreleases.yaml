                      ClusterEndpointType source will lose them; revisit this field then. Mirrors
                      the ResourceReleaseResourceType precedent.
                    properties:
                      environmentConfigs:
                        description: |-
                          EnvironmentConfigs defines the per-env schema.
                          Validates EndpointReleaseBinding.spec.endpointTypeEnvironmentConfigs.
                        properties:
                          openAPIV3Schema:
                            description: OpenAPIV3Schema defines the schema using
                              standard OpenAPI V3 / JSON Schema format.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
