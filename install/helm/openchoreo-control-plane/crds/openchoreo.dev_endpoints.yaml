apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: endpoints.openchoreo.dev
spec:
  group: openchoreo.dev
  names:
    kind: Endpoint
    listKind: EndpointList
    plural: endpoints
    singular: endpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner.projectName
      name: Project
      type: string
    - jsonPath: .spec.type.name
      name: Type
      type: string
    - jsonPath: .spec.address.path
      name: Path
      type: string
    - jsonPath: .spec.address.hostname
      name: Hostname
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Endpoint is the Schema for the endpoints API.
          An Endpoint routes traffic across one or more component endpoints using
          weights, rendered through an EndpointType or ClusterEndpointType. It is
          concerned with L7 traffic routing only; the compute side (ports, network
          policies) stays on Workload.spec.endpoints.
          The plural "endpoints" shadows core v1 Endpoints in kubectl; use the
          fully-qualified "endpoints.openchoreo.dev".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EndpointSpec defines the desired state of Endpoint.
            properties:
              address:
                description: |-
                  Address is the URL this Endpoint serves: a path, on the environment's
                  gateway host or on its own hostname. It belongs to the Endpoint, so it
                  stays the same whatever backends answer it, and it is fixed at creation.
                  Required when the EndpointType's addressKind is Gateway (the default);
                  Service types serve the taken-over component's in-cluster Service
                  instead and must leave it unset.
                properties:
                  hostname:
                    description: |-
                      Hostname is the Endpoint's own hostname, for example payments.example.com.
                      It must match the EndpointType's allowedHostnames, and each environment's
                      binding can override it. When unset, the environment's gateway host is
                      used, the same host component URLs use.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                    type: string
                  path:
                    description: Path is the path prefix clients call, for example
                      /payments.
                    maxLength: 200
                    pattern: ^/[a-z0-9]([-a-z0-9/._]*[a-z0-9])?$
                    type: string
                required:
                - path
                type: object
                x-kubernetes-validations:
                - message: spec.address cannot be changed after creation; create a
                    new Endpoint to serve another address
                  rule: self == oldSelf
              backendRefs:
                description: |-
                  BackendRefs lists what answers the Endpoint's traffic, with relative
                  weights: component workload endpoints of the project, or external
                  services. Like a Service selecting Pods, the Endpoint does not own them.
                  An Endpoint may be left with no backends; see ReclaimPolicy.
                items:
                  description: |-
                    EndpointBackendRef is one backend of an Endpoint: a component workload
                    endpoint or an external service, with its relative weight.
                  properties:
                    component:
                      description: Component is a workload endpoint of a component
                        in the Endpoint's project.
                      properties:
                        endpoint:
                          description: |-
                            Endpoint is the name of the endpoint in the component's
                            Workload.spec.endpoints. Determines the port and protocol.
                          minLength: 1
                          type: string
                        name:
                          description: Name is the name of the Component.
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - endpoint
                      - name
                      type: object
                    external:
                      description: |-
                        External is a service outside OpenChoreo. Its URL is the default for every
                        environment; a binding can override it.
                      properties:
                        url:
                          description: URL is the service's base URL, for example
                            https://legacy.example.com.
                          maxLength: 2048
                          pattern: ^https?://[a-zA-Z0-9]([-a-zA-Z0-9.]*[a-zA-Z0-9])?(:[0-9]{1,5})?(/.*)?$
                          type: string
                      required:
                      - url
                      type: object
                    name:
                      description: |-
                        Name identifies the backend within the Endpoint, for example payments-v1
                        or legacy. Per-environment overrides refer to it.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    weight:
                      default: 1
                      description: |-
                        Weight is the proportion of traffic sent to this backend relative to the
                        sum of all backend weights. Follows Gateway API backendRef weight semantics:
                        0 sends no traffic to this backend.
                      format: int32
                      maximum: 1000000
                      minimum: 0
                      type: integer
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: a backend sets exactly one of component or external
                    rule: has(self.component) != has(self.external)
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              owner:
                description: Owner identifies the Project this Endpoint belongs to.
                properties:
                  projectName:
                    description: ProjectName is the name of the Project this Endpoint
                      belongs to.
                    minLength: 1
                    type: string
                required:
                - projectName
                type: object
                x-kubernetes-validations:
                - message: spec.owner is immutable
                  rule: self == oldSelf
              parameters:
                description: |-
                  Parameters contains values for the parameter schema declared on the referenced
                  EndpointType (or ClusterEndpointType). Validated against the schema by the
                  Endpoint controller; failures surface via status.conditions.
                x-kubernetes-preserve-unknown-fields: true
              reclaimPolicy:
                default: Delete
                description: |-
                  ReclaimPolicy decides what happens when the Endpoint has no backends left,
                  for example after its last backend component was deleted. Delete removes
                  the Endpoint and hands its URL back; Retain keeps it as Orphaned, without
                  routes, until a backend is added.
                enum:
                - Delete
                - Retain
                type: string
              takeOver:
                description: |-
                  TakeOver optionally makes the Endpoint also serve one component workload
                  endpoint's existing URL, so clients of that URL move to the Endpoint
                  without a gap. The component stops rendering its own route for it once
                  the Endpoint's route is accepted, and renders it again when the take-over
                  is removed. It can be added or removed, but not changed.
                properties:
                  component:
                    description: Component is the workload endpoint whose URL is taken
                      over.
                    properties:
                      endpoint:
                        description: |-
                          Endpoint is the name of the endpoint in the component's
                          Workload.spec.endpoints. Determines the port and protocol.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Component.
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - endpoint
                    - name
                    type: object
                required:
                - component
                type: object
              type:
                description: |-
                  Type references the EndpointType or ClusterEndpointType template for this Endpoint.
                  Kind defaults to EndpointType (namespaced); ClusterEndpointType is also allowed.
                properties:
                  kind:
                    default: EndpointType
                    description: Kind is the kind of endpoint type (EndpointType or
                      ClusterEndpointType).
                    enum:
                    - EndpointType
                    - ClusterEndpointType
                    type: string
                  name:
                    description: |-
                      Name is the name of the EndpointType or ClusterEndpointType to reference.
                      Must be a valid DNS-1123 label since it identifies a Kubernetes object.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.type cannot be changed after creation
                  rule: self == oldSelf
            required:
            - owner
            - type
            type: object
            x-kubernetes-validations:
            - message: spec.takeOver can be added or removed but not changed
              rule: '!has(oldSelf.takeOver) || !has(self.takeOver) || self.takeOver
                == oldSelf.takeOver'
            - message: spec.address cannot be added or removed after creation; create
                a new Endpoint to serve another address
              rule: has(self.address) == has(oldSelf.address)
          status:
            description: EndpointStatus defines the observed state of Endpoint.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Endpoint's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              latestRelease:
                description: LatestRelease is the most recent EndpointRelease for
                  this Endpoint.
                properties:
                  hash:
                    description: |-
                      Hash is the content hash of Endpoint.spec + EndpointType/ClusterEndpointType.spec
                      captured at release time.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the EndpointRelease resource.
                    minLength: 1
                    type: string
                required:
                - hash
                - name
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
